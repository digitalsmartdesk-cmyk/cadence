<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light only" />
<title>Sign in to Cadence</title>
<!--[if mso]>
<style type="text/css">
  body, table, td, p, a { font-family: Arial, Helvetica, sans-serif !important; }
  .wordmark { font-family: Georgia, 'Times New Roman', serif !important; }
</style>
<xml>
  <o:OfficeDocumentSettings>
    <o:PixelsPerInch>96</o:PixelsPerInch>
  </o:OfficeDocumentSettings>
</xml>
<![endif]-->
<style type="text/css">
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; background-color: #F8F6F1; }
  table { border-collapse: collapse !important; }
  a { text-decoration: none; }
  @media only screen and (max-width: 620px) {
    .container { width: 100% !important; }
    .px-outer { padding-left: 28px !important; padding-right: 28px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#F8F6F1; font-family: Georgia, 'Times New Roman', serif; color:#1c1c1a;">

<!-- Preheader (hidden) -->
<div style="display:none; font-size:1px; color:#F8F6F1; line-height:1px; max-height:0px; max-width:0px; opacity:0; overflow:hidden;">
  Your sign-in link for Cadence. Valid for 30 minutes.
</div>

<!-- Outer wrapper -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#F8F6F1;">
  <tr>
    <td align="center" style="padding: 48px 12px 64px 12px;">

      <!-- Container -->
      <table role="presentation" class="container" border="0" cellpadding="0" cellspacing="0" width="520" style="width:520px; max-width:520px;">

        <!-- Wordmark -->
        <tr>
          <td class="px-outer" align="left" style="padding: 0 8px 40px 8px;">
            <span class="wordmark" style="font-family: Georgia, 'Times New Roman', serif; font-size: 22px; line-height: 1; color: #243D16; letter-spacing: 0.2px;">Cadence</span>
          </td>
        </tr>

        <!-- Body sentence -->
        <tr>
          <td class="px-outer" align="left" style="padding: 0 8px 32px 8px;">
            <p style="margin:0; font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.55; color: #1c1c1a;">
              Here is your sign-in link. It is valid for 30 minutes.
            </p>
          </td>
        </tr>

        <!-- CTA Button -->
        <tr>
          <td class="px-outer" align="left" style="padding: 0 8px 40px 8px;">
            <!--[if mso]>
            <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{MAGIC_LINK_URL}}" style="height:48px;v-text-anchor:middle;width:180px;" arcsize="0%" stroke="f" fillcolor="#243D16">
              <w:anchorlock/>
              <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:normal;">Sign in &rarr;</center>
            </v:roundrect>
            <![endif]-->
            <!--[if !mso]><!-- -->
            <a href="{{MAGIC_LINK_URL}}"
               style="display: inline-block; background-color: #243D16; color: #ffffff; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1; padding: 16px 28px; mso-padding-alt: 0; border: 1px solid #243D16; border-radius: 2px;">
              <span style="color: #ffffff;">Sign in &nbsp;&rarr;</span>
            </a>
            <!--<![endif]-->
          </td>
        </tr>

        <!-- Plain-text fallback link (small, helps when buttons don't render) -->
        <tr>
          <td class="px-outer" align="left" style="padding: 0 8px 40px 8px;">
            <p style="margin:0; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.55; color: #6b6a64;">
              Or paste this link into your browser:<br />
              <a href="{{MAGIC_LINK_URL}}" style="color: #6b6a64; text-decoration: underline; word-break: break-all;">{{MAGIC_LINK_URL}}</a>
            </p>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td class="px-outer" style="padding: 0 8px 24px 8px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td style="border-top: 1px solid #E4E0D6; font-size: 0; line-height: 0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td class="px-outer" align="left" style="padding: 0 8px 0 8px;">
            <p style="margin:0; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.55; color: #8a887f;">
              If you did not request this, you can ignore this email.
            </p>
          </td>
        </tr>

      </table>
      <!-- /Container -->

    </td>
  </tr>
</table>

</body>
</html>
